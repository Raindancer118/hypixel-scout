// The root build owns no code. It exists so `./gradlew build` and `./gradlew test` reach every
// build at once instead of having to be run once per directory.
//
// The names are the included builds' directory names, which is what Gradle keys them by — not the
// rootProject.name each of them sets.
def builds = ['common', '26.2']

['build', 'test', 'clean'].each { name ->
	tasks.register(name) {
		group = 'build'
		description = "Runs ${name} in every build of the composite."
		dependsOn builds.collect { gradle.includedBuild(it).task(":${name}") }
	}
}
