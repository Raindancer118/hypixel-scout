org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Minecraft Forge for 1.8.9 — the loader Lunar Client and Badlion actually run on this version.
minecraft_version=1.8.9
forge_version=11.15.1.2318-1.8.9

# Unimined drives Forge on a modern Gradle; ForgeGradle of this era does not. 1.4.1 is the newest
# release on maven.wagyourtail.xyz/releases as of 2026-09 (last published 2025-06-30) and is what
# the pre-port 1.8.9-support branch already proved working.
unimined_version=1.4.1

# MCP "stable" names for 1.8.9: Minecraft.getMinecraft(), EntityPlayer, ... — the names every
# 1.8.9 Forge snippet in the wild is written against.
mcp_channel=stable
mcp_version=22-1.8.9

hypixel_mod_api_version=1.0.2

# Legacy Forge 1.8.9 ships no Mixin at all (that only arrived with Forge for 1.12.2+), so the mod
# shades its own copy and bootstraps it through a coremod + launchwrapper tweaker. 0.7.11-SNAPSHOT
# is the last Mixin release built for this generation of launchwrapper environments.
mixin_version=0.7.11-SNAPSHOT

# Scout for Forge 1.8.9 first shipped in 0.5.0 (its bundle, see build.gradle); 26.2 bundles the
# Fabric Scout from gradle/shared.properties. Wins over the shared value, which only fills gaps.
scout_version=0.6.0
