import java.time.Duration

plugins {
	id 'java'
	id 'xyz.wagyourtail.unimined' version "${unimined_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "hypixelscout-mc${project.minecraft_version}-forge"
}

repositories {
	mavenCentral()
	maven {
		name = 'MinecraftForge'
		url = 'https://maven.minecraftforge.net/'
	}
	maven {
		name = 'WagYourTail'
		url = 'https://maven.wagyourtail.xyz/releases'
	}
	maven {
		name = 'Hypixel'
		url = 'https://repo.hypixel.net/repository/Hypixel/'
	}
	maven {
		name = 'Sponge'
		url = 'https://repo.spongepowered.org/maven'
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
}

// Java 8 bytecode, compiled by a modern JDK. The dev client loads these class files directly, so
// anything newer than 8 fails at launch no matter what the finished jar looks like.
java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 8
	it.options.encoding = 'UTF-8'
	it.options.compilerArgs << '-Xlint:-options'
}

unimined.minecraft {
	version project.minecraft_version

	mappings {
		searge()
		mcp(project.mcp_channel, project.mcp_version)
	}

	minecraftForge {
		loader project.forge_version
	}
}

// Classes shaded straight into the mod jar: common (no jar-in-jar on legacy Forge) and Mixin
// (Forge 1.8.9 predates Forge's own Mixin support by several major versions, so the mod carries
// its own copy). Both need to be on the compile classpath, so `compileOnly` extends this too.
configurations {
	shade
	compileOnly.extendsFrom shade
	// `runClient` runs against sourceSets.main.output + the runtime classpath, never the built
	// jar — the shaded classes only physically land inside the jar at the `jar` task, so without
	// this the dev client (and runClientStartupTest) throws NoClassDefFoundError the moment
	// HypixelScout touches a common class or Mixin bootstraps.
	runtimeOnly.extendsFrom shade
}

// Where the Mixin annotation processor writes the refmap for this module. Written outside
// src/main/resources so `clean` and `processResources` do not fight over it; added to the jar's
// inputs explicitly below.
def mixinRefmapDir = layout.buildDirectory.dir('mixinRefmap')
def mixinRefmapFile = 'hypixelscout.mixins.refmap.json'

// A source file with a compile-time-constant VERSION field. `@Mod(version = ...)` must be a
// constant expression, so it cannot be read from a filtered resource at runtime — Forge inspects
// the annotation's raw value via reflection before any resource on the classpath is even open.
def generatedVersionDir = layout.buildDirectory.dir('generated/sources/version/java/main')
tasks.register('generateVersion') {
	group = 'build'
	description = 'Writes HypixelScoutVersion.VERSION from the Gradle mod_version.'
	def outputDir = generatedVersionDir
	inputs.property('version', project.version.toString())
	outputs.dir(outputDir)
	doLast {
		def pkgDir = new File(outputDir.get().asFile, 'de/raindancer118/hypixelscout')
		pkgDir.mkdirs()
		new File(pkgDir, 'HypixelScoutVersion.java').text = """package de.raindancer118.hypixelscout;

/** Generated by the {@code generateVersion} Gradle task — do not edit, do not commit. */
public final class HypixelScoutVersion {
	public static final String VERSION = "${project.version}";

	private HypixelScoutVersion() {
	}
}
"""
	}
}

sourceSets {
	main {
		java.srcDir(generatedVersionDir)
	}
}

compileJava {
	dependsOn tasks.named('generateVersion')
	doFirst {
		mixinRefmapDir.get().asFile.mkdirs()
	}
	options.compilerArgs += [
			"-AoutRefMapFile=${mixinRefmapDir.get().asFile}/${mixinRefmapFile}"
	]
}

dependencies {
	// Gson ships inside the 1.8.9 client, so it is compiled against and never bundled.
	compileOnly 'com.google.code.gson:gson:2.2.4'

	// The Hypixel Mod API is a separate mod the player installs. Compiled against, never
	// bundled: if it is missing the mod falls back to reading chat and still works.
	compileOnly "net.hypixel:mod-api:${hypixel_mod_api_version}"

	// Everything that never touches a Minecraft class. Substituted by the composite build in
	// settings.gradle with ../../common's own jar — never actually resolved from a repository.
	shade "de.raindancer118:hypixelscout-common:${mod_version}"

	// Mixin itself. The excluded modules are already on the game's classpath (Forge/LaunchWrapper
	// bring their own guava/gson/log4j/commons-io/launchwrapper); shading them too would just
	// duplicate classes already present and occasionally shadow a newer one Forge relies on.
	shade("org.spongepowered:mixin:${mixin_version}") {
		exclude module: 'launchwrapper'
		exclude module: 'guava'
		exclude module: 'gson'
		exclude module: 'commons-io'
		exclude module: 'log4j-core'
	}
	annotationProcessor "org.spongepowered:mixin:${mixin_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
	testImplementation "org.assertj:assertj-core:${assertj_version}"
	testImplementation 'com.google.code.gson:gson:2.2.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// This module's own tests never need Minecraft on the classpath (that is what common's test suite
// is for) — just proof the wiring in this build.gradle actually produced what it claims to.
tasks.named('test', Test) {
	useJUnitPlatform()
	testLogging {
		events 'passed', 'skipped', 'failed'
	}
	dependsOn tasks.named('generateVersion')
	systemProperty 'hypixelscout.expectedVersion', project.version.toString()
}

tasks.named('processResources').configure {
	def props = [version: project.version, minecraft_version: project.minecraft_version]
	inputs.properties props

	filesMatching('mcmod.info') {
		expand props
	}
}

// Bundles common's classes and Mixin's classes straight into the MCP-named jar, before
// remapJar turns it into the srg-named jar the game actually loads. Gson is deliberately not
// among the shaded configurations above, so it never ends up in here.
jar {
	dependsOn tasks.named('compileJava')
	from(mixinRefmapDir)
	from({
		configurations.shade.collect { it.isDirectory() ? it : zipTree(it) }
	}) {
		exclude 'META-INF/MANIFEST.MF'
		exclude 'META-INF/*.SF'
		exclude 'META-INF/*.DSA'
		exclude 'META-INF/*.RSA'
	}
	manifest {
		attributes(
				// A coremod, so it can call MixinBootstrap.init() and register the mixin config
				// before FML finishes loading — a plain @Mod entrypoint runs too late for that.
				'FMLCorePlugin'              : 'de.raindancer118.hypixelscout.core.mixin.HypixelScoutMixinLoader',
				'FMLCorePluginContainsFMLMod': 'true',
				// Chains the Mixin launchwrapper tweaker in ahead of FML's own tweaker.
				'TweakClass'                 : 'org.spongepowered.asm.launch.MixinTweaker',
				'TweakOrder'                 : '0',
				'MixinConfigs'               : 'hypixelscout.mixins.json'
		)
	}
}

// Minecraft 1.8.9 runs on Java 8, so the dev client has to as well.
def java8 = javaToolchains.launcherFor {
	languageVersion = JavaLanguageVersion.of(8)
}

tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
	javaLauncher = java8
}

// Legacy Forge coremods are discovered by scanning classpath JAR manifests for
// `FMLCorePlugin`/`TweakClass` (wired above, in `jar.manifest`, for the packaged mod). A dev run's
// classpath is a plain compiled-classes directory with no manifest at all, so that coremod — and
// with it the whole Mixin bootstrap — is invisible to `runClient`. Passing the tweaker and the
// mixin config directly as launch arguments is the standard dev-environment workaround for
// exactly this; production still goes through the manifest/coremod path.
tasks.named('runClient', JavaExec).configure {
	args '--tweakClass', 'org.spongepowered.asm.launch.MixinTweaker'
	args '--mixin', 'hypixelscout.mixins.json'
}

// Gated on the requested task names so a plain `./gradlew runClient` still gets everything below,
// just pointed at the normal dev run directory instead of the isolated startup-test one.
def startupTestRequested = gradle.startParameter.taskNames.any { it.contains('runClientStartupTest') }

// The Hypixel Mod API is a separate mod the player installs — required-after, so the dev client
// (and the startup test, which loads the same mod set) needs it physically in the mods folder,
// not just on the compile classpath. Fetched by Gradle from Modrinth's maven, never committed.
configurations {
	hypixelModApiRuntime
}

dependencies {
	hypixelModApiRuntime "maven.modrinth:hypixel-mod-api:${hypixel_mod_api_version}"
}

def devRunModsDir = startupTestRequested
		? layout.buildDirectory.dir('run/startupTest/mods')
		: layout.projectDirectory.dir('run/client/mods')

tasks.register('installHypixelModApi', Copy) {
	group = 'hypixelscout'
	description = 'Downloads the Hypixel Mod API Forge 1.8.9 jar into the dev client mods folder ' +
			'(never committed — see gradle.properties for the pinned version).'
	from configurations.hypixelModApiRuntime
	into devRunModsDir
}

tasks.named('runClient').configure {
	dependsOn tasks.named('installHypixelModApi')
}

// Own client-startup smoke test: Forge 1.8.9 has no client-gametest API, so this drives a real dev
// client headlessly (xvfb-run), waits for the main menu, screenshots it and exits — see
// de.raindancer118.hypixelscout.startup. The Gradle task fails the build if the client exits
// non-zero, times out, or leaves no result file behind.
//
// This reconfigures the real `runClient` task (Unimined's `RunConfig`, a `JavaExec` subclass)
// rather than cloning its classpath/args into a fresh JavaExec task: `RunConfig.exec()` fills in
// tokens like `${game_directory}` from its own `workingDir` property at execution time, so a copy
// taken at configuration time carries the literal, unresolved `${...}` placeholders instead — the
// dev client then fails immediately trying to use a directory literally named `${game_directory}`.
if (startupTestRequested) {
	tasks.named('runClient', JavaExec).configure {
		def runDir = layout.buildDirectory.dir('run/startupTest').get().asFile
		workingDir = runDir
		ignoreExitValue = true
		timeout.set(Duration.ofMinutes(5))
		systemProperty 'hypixelscout.startupTest', 'true'
		// LWJGL2 on a headless/software-rendered Linux X server needs to be told not to insist
		// on a real GPU context.
		jvmArgs += [
				'-Dorg.lwjgl.opengl.Display.allowSoftwareOpenGL=true',
				'-Dorg.lwjgl.util.NoChecks=true',
				'-Djava.awt.headless=false'
		]
		doFirst {
			runDir.mkdirs()
		}
	}
}

tasks.register('runClientStartupTest') {
	group = 'verification'
	description = 'Boots a headless dev client, waits for the main menu, screenshots it, and ' +
			'fails the build unless it reports success and exits cleanly.'
	dependsOn tasks.named('runClient')

	doLast {
		def runDir = layout.buildDirectory.dir('run/startupTest').get().asFile
		def resultFile = new File(runDir, 'startupTest/result.txt')
		def exit = tasks.named('runClient', JavaExec).get().executionResult.get().exitValue
		if (exit != 0) {
			throw new GradleException("runClientStartupTest: dev client exited ${exit} — see " +
					"${runDir}/client.log")
		}
		if (!resultFile.exists()) {
			throw new GradleException("runClientStartupTest: no result file at ${resultFile} " +
					"— the client exited 0 without the startup test hook ever running")
		}
		def content = resultFile.text.trim()
		if (!content.startsWith('PASS')) {
			throw new GradleException("runClientStartupTest: ${content}")
		}
		logger.lifecycle("runClientStartupTest: ${content}")
	}
}

// A Modrinth modpack carrying both jars as overrides. Lunar Client refuses to load a jar that was
// merely copied into its mods folder — the launcher registers what it installed itself and passes
// the game that list — but it will import a modpack, and a modpack may bring its own files.
tasks.register('mrpack', Zip) {
	group = 'distribution'
	description = 'Bundles the mod and the Hypixel Mod API into an importable .mrpack.'
	// remapJar, not jar: the plain one carries MCP names, which exist only in the dev client.
	dependsOn tasks.named('remapJar')

	archiveFileName = "hypixel-scout-${project.version}-mc1.8.9.mrpack"
	destinationDirectory = layout.buildDirectory

	from(layout.buildDirectory.file('tmp/mrpack/modrinth.index.json'))
	into('overrides/mods') {
		from tasks.named('remapJar')
	}

	doFirst {
		def index = layout.buildDirectory.file('tmp/mrpack/modrinth.index.json').get().asFile
		index.parentFile.mkdirs()
		index.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
				formatVersion: 1,
				game         : 'minecraft',
				versionId    : project.version.toString(),
				name         : 'Hypixel Scout',
				summary      : 'Bedwars opponent stats from the Hypixel API, with the Hypixel Mod ' +
						'API it needs.',
				files        : [],
				dependencies : [
						minecraft: project.minecraft_version,
						forge    : project.forge_version.toString().replace('-1.8.9', '')
				]
		]))
	}
}
