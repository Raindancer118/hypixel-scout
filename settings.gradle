rootProject.name = 'hypixel-scout'

// Two independent builds rather than one with subprojects. Everything that never touches a
// Minecraft class is its own build, so a version module can sit beside 26.2 without either one's
// Loom, mappings or Java level leaking into the other — the 1.8.9-support branch is exactly that.
includeBuild 'common'
includeBuild 'versions/26.2'
