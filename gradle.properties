# MCP "stable" names for 1.8.9: Minecraft.getMinecraft(), EntityPlayer, ... — the names every
# 1.8.9 Forge snippet in the wild is written against.
mcp_channel=stable
mcp_version=22-1.8.9

junit_version=5.10.2
hypixel_mod_api_version=1.0.2
