name: build

on:
  push:
    branches: [ main, master, forge-1.8.9 ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # CheatWatch comes from the private Reposilite: a read-only token, and TLS 1.2 for its SNI quirk.
      MAVEN_REGISTRY_USERNAME: ${{ secrets.MAVEN_REGISTRY_USERNAME }}
      MAVEN_REGISTRY_PASSWORD: ${{ secrets.MAVEN_REGISTRY_PASSWORD }}
      JAVA_TOOL_OPTIONS: -Djdk.tls.client.protocols=TLSv1.2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      # Reaches both builds of the composite: the shared core and the 26.2 module.
      - name: Build and unit test
        run: ./gradlew build

      - name: Client startup test (26.2)
        # A real client, a staged Bedwars game, every screen photographed.
        run: xvfb-run -a ./gradlew -p versions/26.2 runClientGameTest

      # LWJGL 2 reads the display modes by running xrandr; without it the client dies at startup.
      - name: xrandr for LWJGL 2
        run: sudo apt-get update -q && sudo apt-get install -y -q x11-xserver-utils

      # LWJGL 2 finds no display mode on Xvfb's default 8-bit screen (Ubuntu's xvfb-run default),
      # so the 1.8.9 clients get an explicit 24-bit one.
      - name: Client startup test (1.8.9)
        timeout-minutes: 15
        # Forge 1.8.9 has no client-gametest API: a headless dev client walks through menu,
        # commands, a staged Bedwars world, HUD, cheat checks and every screen, with screenshots —
        # see de.raindancer118.hypixelscout.startup in versions/1.8.9.
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew -p versions/1.8.9 runClientStartupTest

      - name: Production startup test (1.8.9)
        timeout-minutes: 15
        # The shipped jar in a launcher-style Forge client: vanilla jar, Forge universal, mods/.
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew -p versions/1.8.9 runProductionStartupTest

      - name: Modpack (26.2)
        run: ./gradlew -p versions/26.2 mrpack

      - uses: actions/upload-artifact@v4
        with:
          name: hypixel-scout
          path: |
            versions/26.2/build/libs/hypixelscout-mc26.2-*.jar
            versions/26.2/build/hypixel-scout-*.mrpack
            versions/1.8.9/build/libs/hypixelscout-mc1.8.9-forge-*.jar

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            versions/26.2/build/run/clientGameTest/screenshots
            versions/1.8.9/build/run/startupTest/screenshots
