name: release

# A tag is the release: pushing 0.2.0 builds the jar, runs the tests that prove the mod loads, and
# publishes it with the modpack. Nothing is done by hand, so nothing can be forgotten.
on:
  push:
    tags: [ '*.*.*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Refuse a tag that disagrees with the mod version
        run: |
          declared=$(grep '^mod_version=' gradle/shared.properties | cut -d= -f2)
          if [ "$declared" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match mod_version ${declared}"
            exit 1
          fi

      - name: Build and unit test
        run: ./gradlew build

      # A green build does not prove the mod loads, so the client tests gate the release too.
      - name: Client startup test (26.2)
        run: xvfb-run -a ./gradlew -p versions/26.2 runClientGameTest

      - name: Client startup test (1.8.9)
        run: xvfb-run -a ./gradlew -p versions/1.8.9 runClientStartupTest

      - name: Production startup test (1.8.9)
        # The shipped jar in a launcher-style Forge client: vanilla jar, Forge universal, mods/.
        run: xvfb-run -a ./gradlew -p versions/1.8.9 runProductionStartupTest

      - name: Modpack (26.2)
        run: ./gradlew -p versions/26.2 mrpack

      - uses: softprops/action-gh-release@v2
        with:
          name: Hypixel Scout ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            versions/26.2/build/libs/hypixelscout-mc26.2-${{ github.ref_name }}.jar
            versions/26.2/build/hypixel-scout-${{ github.ref_name }}-mc26.2.mrpack
            versions/1.8.9/build/libs/hypixelscout-mc1.8.9-forge-${{ github.ref_name }}.jar
