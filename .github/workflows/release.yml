name: release

# The Forge 1.8.9 branch releases as legacy-X.Y.Z: the same version number as the master release it
# carries, prefixed so the two never collide. A tag is the release: pushing legacy-0.18.0 builds
# the jar, runs the tests that prove the mod loads, and publishes it. Nothing is done by hand.
on:
  push:
    tags: [ 'legacy-*.*.*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Refuse a tag that disagrees with the mod version
        run: |
          declared=$(grep '^mod_version=' gradle/shared.properties | cut -d= -f2)
          if [ "legacy-$declared" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match legacy-${declared}"
            exit 1
          fi
          echo "VERSION=$declared" >> "$GITHUB_ENV"

      - name: Build and unit test
        run: ./gradlew -p common build && ./gradlew -p versions/1.8.9 build

      # A green build does not prove the mod loads, so both client tests gate the release.
      - name: Client startup test (1.8.9)
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew -p versions/1.8.9 runClientStartupTest

      - name: Production startup test (1.8.9)
        # The shipped jar in a launcher-style Forge client: vanilla jar, Forge universal, mods/.
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew -p versions/1.8.9 runProductionStartupTest

      - uses: softprops/action-gh-release@v2
        with:
          name: Hypixel Scout ${{ env.VERSION }} for Forge 1.8.9
          generate_release_notes: true
          fail_on_unmatched_files: true
          # The 26.2 release from master stays the one GitHub shows as latest.
          make_latest: false
          files: |
            versions/1.8.9/build/libs/hypixelscout-mc1.8.9-forge-${{ env.VERSION }}.jar
